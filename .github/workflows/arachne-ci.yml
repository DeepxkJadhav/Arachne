name: Arachne CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Arachne Master E2E & Intent Regression Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Intent & Report Export Regression Suite
        run: node test/regression-intent-reports-suite.mjs

      - name: Run Master Acceptance Suite
        run: node test/e2e-master-verification.mjs
