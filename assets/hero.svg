<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <linearGradient id="arachne-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0507"/>
      <stop offset="50%" stop-color="#12080c"/>
      <stop offset="100%" stop-color="#070305"/>
    </linearGradient>
    <linearGradient id="arachne-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#arachne-bg)"/>

  <!-- Geometric Web Constellation Right -->
  <g transform="translate(900, 180)">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="#e11d48" stroke-width="1" stroke-opacity="0.25"/>
    <polygon points="0,-85 73,-42 73,42 0,85 -73,42 -73,-42" fill="none" stroke="#e11d48" stroke-width="1" stroke-opacity="0.4"/>
    <polygon points="0,-40 34,-20 34,20 0,40 -34,20 -34,-20" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Center Core Node -->
    <circle cx="0" cy="0" r="7" fill="#e11d48" filter="url(#glow-crimson)"/>

    <!-- Radial Spokes -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="0" x2="112" y2="-65" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="0" x2="112" y2="65" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="0" x2="-112" y2="65" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="0" x2="-112" y2="-65" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Vertex Points -->
    <circle cx="0" cy="-85" r="3.5" fill="#f43f5e"/>
    <circle cx="73" cy="-42" r="3.5" fill="#f43f5e"/>
    <circle cx="73" cy="42" r="3.5" fill="#f43f5e"/>
    <circle cx="0" cy="85" r="3.5" fill="#f43f5e"/>
    <circle cx="-73" cy="42" r="3.5" fill="#f43f5e"/>
    <circle cx="-73" cy="-42" r="3.5" fill="#f43f5e"/>
  </g>

  <!-- Left Header Tag -->
  <rect x="70" y="55" width="280" height="26" rx="13" fill="rgba(225, 29, 72, 0.12)" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="85" cy="68" r="4" fill="#e11d48"/>
  <text x="98" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#fda4af">TERMINAL-FIRST // CDP ENGINE</text>

  <!-- Main Hero Title -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="3" fill="#f8fafc">ARA<tspan fill="#e11d48">CHNE</tspan></text>

  <!-- Subtitle Tagline -->
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Terminal-First Autonomous Web Intelligence &amp; Deep Research CLI</text>

  <!-- Description paragraph -->
  <text x="70" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#64748b">Native Chrome/Brave CDP · SQLite WAL Knowledge Graphs · Multi-Format Dossier Compilation (PDF/DOCX/JSON)</text>

  <!-- Capability Badges -->
  <g transform="translate(70, 275)">
    <rect width="135" height="28" rx="6" fill="#18070d" stroke="#3b0f1d" stroke-width="1"/>
    <text x="67.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">CHROME CDP</text>
  </g>
  <g transform="translate(215, 275)">
    <rect width="145" height="28" rx="6" fill="#18070d" stroke="#3b0f1d" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">SQLITE WAL</text>
  </g>
  <g transform="translate(370, 275)">
    <rect width="145" height="28" rx="6" fill="#18070d" stroke="#3b0f1d" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">9-FORMAT DOSSIER</text>
  </g>
  <g transform="translate(525, 275)">
    <rect width="125" height="28" rx="6" fill="#18070d" stroke="#3b0f1d" stroke-width="1"/>
    <text x="62.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">HACKER REPL</text>
  </g>
</svg>
